name: Native Rust Windows release
on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/rylune-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rylune-windows-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rust tests
        run: cargo test
      - name: Official metadata and Java process smoke test
        run: cargo test official_metadata_and_java_process -- --ignored --nocapture
      - name: Compile native launcher
        run: cargo build --release
      - name: Prepare executable and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          Copy-Item target/release/rylune-client.exe release-files/RyluneClient.exe -ErrorAction Stop
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path $nsis)) { choco install nsis -y --no-progress }
          if (!(Test-Path $nsis)) { throw 'NSIS unavailable' }
          & $nsis /V2 installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: RyluneClient-native-Windows
          path: launcher/release-files/*.exe
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.9.0-alpha'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag --clobber release-files/RyluneClient.exe release-files/RyluneClient-Setup.exe
          } else {
            gh release create $tag --target $env:GITHUB_SHA --title 'Rylune Client v0.9 Native' --notes 'Native Rust UI and launch backend. No Node.js or WebView2 dependency. Windows x64 alpha; graphical game launch and sign-in require runtime testing.' --prerelease release-files/RyluneClient.exe release-files/RyluneClient-Setup.exe
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
