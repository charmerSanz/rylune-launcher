name: Rylune v0.12 native Windows
on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/rylune-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rylune-windows-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rust tests
        run: cargo test
      - name: Official metadata and Java process smoke test
        run: cargo test official_metadata_and_java_process -- --ignored --nocapture
      - name: Compile native launcher
        run: cargo build --release
      - name: Prepare executable and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          Copy-Item target/release/rylune-client.exe release-files/RyluneClient.exe -ErrorAction Stop
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path $nsis)) { choco install nsis -y --no-progress }
          if (!(Test-Path $nsis)) { throw 'NSIS unavailable' }
          & $nsis /V2 installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: RyluneClient-v0.12-Windows
          path: launcher/release-files/*.exe
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v0.12.0-alpha
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rylune Client v0.12" --notes "Modrinth content browser, isolated Fabric modpack imports and refined native interface. Windows alpha; gameplay and sign-in require runtime testing." --prerelease; then
              if gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release-files/RyluneClient.exe &&
                gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release-files/RyluneClient-Setup.exe; then
                gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets
                exit 0
              fi
            fi
            sleep $((attempt * 10))
          done
          exit 1
