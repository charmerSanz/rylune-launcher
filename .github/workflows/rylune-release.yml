name: Rylune Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/rylune-release.yml'
permissions:
  contents: write
concurrency:
  group: rylune-windows-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
        working-directory: launcher
      - run: npm run build
        working-directory: launcher
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        working-directory: launcher
      - name: Official metadata and Java process smoke test
        run: cargo test --manifest-path src-tauri/Cargo.toml official_metadata_and_java_process -- --ignored --nocapture
        working-directory: launcher
      - run: npm run tauri build
        working-directory: launcher
      - name: Prepare EXEs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          Copy-Item 'launcher/src-tauri/target/release/rylune-launcher.exe' 'release-files/RyluneClient.exe' -ErrorAction Stop
          $installer = Get-ChildItem 'launcher/src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Missing installer' }
          Copy-Item $installer.FullName 'release-files/RyluneClient-Setup.exe' -ErrorAction Stop
      - uses: actions/upload-artifact@v4
        with:
          name: Rylune-Windows
          path: release-files/*.exe
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.8.0-alpha'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag --clobber release-files/RyluneClient.exe release-files/RyluneClient-Setup.exe
          } else {
            gh release create $tag --target (git rev-parse HEAD).Trim() --title 'Rylune Client v0.8' --notes 'Automatic Java installation, download repair, launch diagnostics and simplified UI. Windows alpha, unsigned; graphical gameplay and Microsoft authentication not yet verified.' --prerelease release-files/RyluneClient.exe release-files/RyluneClient-Setup.exe
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
